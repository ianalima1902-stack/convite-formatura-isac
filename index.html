<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Formatura do ABC - Isac Gomes</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#071b48;font-family:Arial,sans-serif}
body{display:flex;justify-content:center}
#app{position:relative;width:min(100vw,56.28vh);aspect-ratio:941/1672;overflow:hidden;background:#071b48}
#screen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.key{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:18%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.key:active{background:rgba(255,255,255,.18);transform:scale(.94)}
#dots{position:absolute;left:50%;top:35.6%;transform:translateX(-50%);z-index:5;
color:#fff;background:rgba(5,30,92,.72);border:2px solid #f7b51b;border-radius:999px;
min-width:145px;height:36px;padding:4px 14px;text-align:center;font-size:20px;letter-spacing:5px;
box-shadow:0 3px 12px rgba(0,0,0,.25);opacity:0;transition:.2s}
#dots.show{opacity:1}
#msg{position:absolute;left:50%;top:38.3%;transform:translateX(-50%);z-index:6;color:#fff;
font-weight:700;font-size:12px;text-shadow:0 2px 5px #000;white-space:nowrap}
#success{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:20;
background:linear-gradient(rgba(4,30,95,.94),rgba(4,30,95,.98));color:white;text-align:center;padding:30px}
#success.show{display:flex;animation:fade .5s ease}
#success h1{color:#ffc21c;font-size:30px;margin:0 0 10px}
#success p{font-size:17px;line-height:1.45;margin:0}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<main id="app">
<img id="screen" src="senha.png" alt="Tela de senha do convite">
<div id="dots" aria-live="polite"></div>
<div id="msg" aria-live="polite"></div>
<div id="keys"></div>
<section id="success">
  <div><h1>Senha correta! ✨</h1><p>O convite foi aberto.<br>Esta é a tela de teste.</p></div>
</section>
</main>
<script>
const PASSWORD="abc2026";
let typed="";
const keys=document.getElementById("keys"), dots=document.getElementById("dots"), msg=document.getElementById("msg");

// Coordenadas em porcentagem, alinhadas à imagem 941 x 1672.
// Livro esquerdo: A–Y em 5x5 + Z. Livro direito: números + apagar.
const letters=[
 ['a',18.7,47.5],['b',26.0,47.5],['c',33.5,47.5],['d',41.0,47.5],['e',48.3,47.5],
 ['f',18.0,52.5],['g',25.7,52.5],['h',33.1,52.5],['i',40.5,52.5],['j',48.0,52.5],
 ['k',17.5,57.5],['l',25.0,57.5],['m',32.5,57.5],['n',40.0,57.5],['o',47.5,57.5],
 ['p',17.0,62.6],['q',24.5,62.6],['r',32.0,62.6],['s',39.5,62.6],['t',47.0,62.6],
 ['u',16.5,67.7],['v',24.0,67.7],['w',31.5,67.7],['x',39.0,67.7],['y',46.5,67.7],
 ['z',31.0,72.7]
];
const nums=[
 ['1',62.5,52.7],['2',72.9,53.7],['3',82.5,53.7],
 ['4',62.0,58.0],['5',72.5,58.0],['6',83.5,59.5],
 ['7',62.0,63.5],['8',72.5,64.5],['9',85.5,65.5],
 ['0',73.5,70.6]
];
function addKey(char,x,y,w=6.4,h=4.1){
 const b=document.createElement("button");
 b.className="key"; b.setAttribute("aria-label",char);
 const adjustX = 0.55;
 const adjustY = 0.65;
 b.style.left=(x + adjustX - w/2)+"%"; b.style.top=(y + adjustY - h/2)+"%";
 b.style.width=w+"%"; b.style.height=h+"%";
 b.onclick=()=>press(char); keys.appendChild(b);
}
letters.forEach(k=>addKey(...k));
nums.forEach(k=>addKey(...k));
addKey("apagar",84.2,71.6,8.2,4.6);

function press(c){
 msg.textContent="";
 if(c==="apagar"){ typed=typed.slice(0,-1); update(); return; }
 if(typed.length>=PASSWORD.length) typed="";
 typed+=c.toLowerCase(); update();
 if(typed.length===PASSWORD.length){
   if(typed===PASSWORD){
     setTimeout(()=>document.getElementById("success").classList.add("show"),220);
   }else{
     msg.textContent="Senha incorreta. Tente novamente.";
     if(navigator.vibrate) navigator.vibrate(120);
     setTimeout(()=>{typed=""; update();},700);
   }
 }
}
function update(){
 dots.textContent="•".repeat(typed.length);
 dots.classList.toggle("show",typed.length>0);
}
</script>
</body>
</html>
